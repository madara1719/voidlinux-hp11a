name: Build Void Linux Image for HP Chromebook 11a (Kappa)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROOT_UUID: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
      IMAGE_SIZE: "4G"
      VOID_ROOTFS_URL: "https://repo-default.voidlinux.org/live/current/void-aarch64-ROOTFS-20250202.tar.xz"
      IMAGE_NAME: "void-linux-kappa-lxqt-wayland.img"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies (QEMU & tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support wget xz-utils gdisk dosfstools e2fsprogs dpkg-dev jq

      - name: Download Void Linux ROOTFS (aarch64)
        run: |
          wget -q "$VOID_ROOTFS_URL" -O void-rootfs.tar.xz
          echo "Rootfs descargado."

      - name: Prepare chroot directory and extract ROOTFS
        run: |
          sudo mkdir -p /mnt/void
          sudo tar xpvf void-rootfs.tar.xz -C /mnt/void
          echo "Rootfs extraído en /mnt/void."

      - name: Mount virtual filesystems for chroot
        run: |
          sudo mount --rbind /dev /mnt/void/dev
          sudo mount --rbind /proc /mnt/void/proc
          sudo mount --rbind /sys /mnt/void/sys
          sudo cp /etc/resolv.conf /mnt/void/etc/resolv.conf
          echo "Sistemas de archivos virtuales montados."

      - name: Install base system and enable repositories inside chroot
        run: |
          sudo chroot /mnt/void /bin/bash -c '
            set -e
            xbps-install -Syu xbps
            xbps-install -y base-system

            echo "repository=https://raw.githubusercontent.com/sofijacom/hyprland-void/repository-aarch64-glibc" > /etc/xbps.d/hyprland-void.conf
            echo y | xbps-install -S
            echo "Sistema base y repositorio de Hyprland configurados."
          '

      - name: Install full software stack inside chroot
        run: |
          sudo chroot /mnt/void /bin/bash -c '
            set -e
            # Instalación del stack completo (Añadidas dependencias de Vesktop)
            xbps-install -y \
              wayland mesa-dri \
              lxqt-wayland-session lxqt-session \
              hyprland xdg-desktop-portal-hyprland \
              imv \
              gparted \
              foot \
              greetd tuigreet \
              seatd \
              plymouth plymouth-data \
              dracut \
              wget curl git python3 python3-pip \
              linux-firmware \
              linux-firmware-network \
              libgtk-3 libnotify libnss libxss libxtst xdg-utils libatspi libuuid libsecret

            # Habilitar servicios esenciales
            ln -s /etc/sv/seatd /etc/runit/runsvdir/default/ 2>/dev/null || true
            ln -s /etc/sv/greetd /etc/runit/runsvdir/default/ 2>/dev/null || true
            echo "Stack base instalado."
          '

      - name: Configure greetd and LXQt Wayland session
        run: |
          sudo tee /mnt/void/etc/greetd/config.toml > /dev/null <<'EOF'
          [terminal]
          vt = 7

          [default_session]
          command = "tuigreet --remember -t --remember-session --cmd startlxqtwayland"
          user = "greeter"
          EOF

          sudo chroot /mnt/void /bin/bash -c '
            id -u greeter &>/dev/null || useradd -m -G video,input greeter
            echo "greeter:changeme" | chpasswd 2>/dev/null || true
          '
          echo "greetd configurado para iniciar LXQt Wayland."

      - name: Handle Vesktop installation (arm64 .deb)
        run: |
          set -e
          VESKTOP_DEB_URL=$(curl -s https://api.github.com/repos/Vencord/Vesktop/releases/latest | jq -r '.assets[] | select(.name | endswith("_arm64.deb")) | .browser_download_url')
          
          if [ -z "$VESKTOP_DEB_URL" ] || [ "$VESKTOP_DEB_URL" = "null" ]; then
            echo "❌ No se pudo encontrar el asset .deb para arm64."
            exit 1
          fi
          
          wget -q "$VESKTOP_DEB_URL" -O vesktop.deb
          sudo mkdir -p /tmp/vesktop_extract
          sudo dpkg-deb -x vesktop.deb /tmp/vesktop_extract
          sudo cp -a /tmp/vesktop_extract/* /mnt/void/
          echo "✅ Vesktop extraído e integrado."

      - name: Download and extract prebuilt kpart (hexdump0815)
        run: |
          set -e
          KPART_URL="https://github.com/hexdump0815/linux-mainline-mediatek-mt81xx-kernel/releases/download/6.18.34-stb-cbm%2B/6.18.34-stb-cbm%2B.tar.gz"
          wget -q "$KPART_URL" -O /tmp/kukui-kernel.tar.gz
          mkdir -p /tmp/kukui-extract
          tar xzf /tmp/kukui-kernel.tar.gz -C /tmp/kukui-extract
          
          KPART_FILE=$(find /tmp/kukui-extract -name "*.kpart*" | head -n 1)
          if [ -z "$KPART_FILE" ]; then
            echo "❌ No se encontró ningún archivo .kpart dentro del tar.gz"
            exit 1
          fi
          
          sudo cp "$KPART_FILE" /mnt/void/boot/void-boot.kpart
          echo "✅ kpart preconstruido copiado."

      - name: Assemble final disk image (GPT + partitions)
        run: |
          set -e
          # 1. Crear archivo de imagen
          dd if=/dev/zero of="$IMAGE_NAME" bs=1M count=0 seek=$(numfmt --from=iec $IMAGE_SIZE | numfmt --to-unit=1048576) status=progress

          # 2. Crear tabla de particiones GPT
          sgdisk -Z "$IMAGE_NAME"
          sgdisk -n 1:2048:67583 -t 1:66 -c 1:"Kernel" "$IMAGE_NAME"
          sgdisk -n 2:67584:0 -t 2:8300 -c 2:"Rootfs" "$IMAGE_NAME"

          # 3. Configurar loop device
          LOOP_DEV=$(sudo losetup --show -fP "$IMAGE_NAME")
          echo "Loop device: $LOOP_DEV"

          # 4. Escribir el kpart
          sudo dd if=/mnt/void/boot/void-boot.kpart of="${LOOP_DEV}p1" bs=1M status=progress conv=fsync

          # 5. Formatear y copiar rootfs
          sudo mkfs.ext4 -U "$ROOT_UUID" -F "${LOOP_DEV}p2"
          sudo mkdir -p /mnt/final_root
          sudo mount "${LOOP_DEV}p2" /mnt/final_root
          sudo cp -a /mnt/void/* /mnt/final_root/
          
          # Limpieza
          sudo rm -f /mnt/final_root/boot/void-boot.kpart
          sudo umount /mnt/final_root

          # 6. Atributos para Depthcharge
          sudo sgdisk -A 1:or:11f000000000000 "$IMAGE_NAME"

          # 7. Limpieza final
          sudo losetup -d "$LOOP_DEV"
          echo "Imagen final creada: $IMAGE_NAME"

      - name: Upload final image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-linux-kappa-image
          path: ${{ env.IMAGE_NAME }}
          if-no-files-found: error
